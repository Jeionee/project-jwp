<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | E-Josjis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#0f172a' } } }
    }
  </script>
  <style>
    /* Animasi fade-in untuk card */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation: fadeUp 0.45s ease both;
    }

    /* Shake animasi saat login gagal */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-6px);
      }

      40%,
      80% {
        transform: translateX(6px);
      }
    }

    .shake {
      animation: shake 0.4s ease;
    }
  </style>
</head>

<body class="bg-slate-50 font-sans antialiased min-h-screen flex items-center justify-center px-4">

  <!-- Background dekoratif -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-100 rounded-full opacity-50 blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-emerald-100 rounded-full opacity-50 blur-3xl"></div>
  </div>

  <!-- Card Login -->
  <div class="relative w-full max-w-md fade-up">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">

      <!-- Logo / Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-brand rounded-xl mb-4 shadow-lg">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Selamat Datang</h1>
        <p class="text-slate-500 text-sm mt-1">Silahkan masuk untuk mengakses sistem</p>
      </div>

      <!-- Alert Error -->
      <div id="alertError"
        class="hidden mb-5 flex items-start gap-3 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span id="alertMsg">Username atau password salah.</span>
      </div>

      <!-- Form -->
      <form id="formLogin" class="space-y-5" novalidate>

        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Username <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input type="text" id="inputUsername" autocomplete="username" placeholder="Masukkan username" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm
                     focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent
                     transition placeholder-slate-400" />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Password <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input type="password" id="inputPassword" autocomplete="current-password" placeholder="Masukkan password"
              class="w-full pl-10 pr-12 py-2.5 border border-slate-300 rounded-xl text-sm
                     focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent
                     transition placeholder-slate-400" />
            <!-- Toggle show/hide password -->
            <button type="button" id="togglePassword"
              class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600">
              <svg id="iconEye" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Tombol Login -->
        <button type="submit" id="btnLogin" class="w-full bg-brand text-white py-2.5 rounded-xl text-sm font-semibold
                 hover:bg-slate-800 active:scale-95 transition-all duration-150 shadow-sm
                 flex items-center justify-center gap-2 mt-2">
          <span id="btnText">Masuk</span>
          <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
          </svg>
        </button>
      </form>

      <!-- Link Register -->
      <p class="mt-6 text-center text-sm text-slate-500">
        Belum punya akun?
        <a href="/register.html" class="font-semibold text-slate-800 hover:text-indigo-600 transition-colors">
          Register sekarang
        </a>
      </p>

    </div>

    <p class="text-center text-xs text-slate-400 mt-5">

    </p>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>

</html>
