<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Pegawai | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#0f172a' } } }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- Header -->
    <header class="mb-8 flex justify-between items-end">
      <div>
        <a href="/" class="text-sm text-slate-400 hover:text-slate-600 transition-colors mb-1 inline-block">← Kembali ke Dashboard</a>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Data Pegawai</h1>
        <p class="text-slate-500 mt-1 text-sm">Kelola data pegawai perusahaan.</p>
      </div>
      <button id="btnTambah"
        class="bg-brand text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 transition-colors shadow-sm inline-flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Tambah Pegawai
      </button>
    </header>

    <!-- Stats -->
    <div id="kpiCards" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm animate-pulse h-24"></div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-48">
          <input id="searchInput" type="text" placeholder="Cari nama pegawai..."
            class="pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400 w-full" />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <select id="filterGender" class="text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-600">
          <option value="">Semua Gender</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="text-slate-500 border-b border-slate-200 bg-slate-50/60">
              <th class="px-6 py-4 font-medium">ID</th>
              <th class="px-6 py-4 font-medium">Nama Lengkap</th>
              <th class="px-6 py-4 font-medium">Gender</th>
              <th class="px-6 py-4 font-medium">Pendidikan</th>
              <th class="px-6 py-4 font-medium">Usia</th>
              <th class="px-6 py-4 font-medium text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="employeeTable" class="divide-y divide-slate-100">
            <tr><td colspan="6" class="px-6 py-10 text-center text-slate-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 z-50 px-5 py-3.5 rounded-xl shadow-lg text-sm font-medium text-white"></div>

  <!-- Modal Form -->
  <div id="modalForm" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="bg-white p-7 rounded-2xl shadow-2xl w-full max-w-md">
      <div class="flex justify-between items-center mb-5">
        <h3 id="modalTitle" class="text-xl font-semibold text-slate-900">Tambah Pegawai</h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <form id="formPegawai" class="space-y-4">
        <input type="hidden" id="empId" />
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap <span class="text-red-400">*</span></label>
          <input type="text" id="empName" required placeholder="Contoh: Budi Santoso"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Gender <span class="text-red-400">*</span></label>
            <select id="empGender" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Usia <span class="text-red-400">*</span></label>
            <input type="number" id="empAge" required min="18" max="70" placeholder="25"
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Pendidikan <span class="text-red-400">*</span></label>
          <select id="empEdu" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
            <option value="SMA/SMK">SMA/SMK</option>
            <option value="D3">D3</option>
            <option value="S1">S1</option>
            <option value="S2">S2</option>
          </select>
        </div>
        <div id="formError" class="hidden text-sm text-red-500 bg-red-50 border border-red-200 px-4 py-3 rounded-lg"></div>
        <div class="flex gap-3 pt-2">
          <button type="button" id="btnBatal" class="flex-1 px-4 py-2.5 text-sm font-medium border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50">Batal</button>
          <button type="submit" id="btnSimpan" class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-brand rounded-lg hover:bg-slate-800">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Hapus -->
  <div id="modalHapus" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
        <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <h3 class="text-lg font-medium text-slate-900 mb-2">Hapus Pegawai?</h3>
      <p class="text-sm text-slate-500 mb-6">Data akan dihapus permanen dari database.</p>
      <div class="flex gap-3">
        <button id="btnBatalHapus" class="flex-1 px-4 py-2 text-sm font-medium border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50">Batal</button>
        <button id="btnKonfirmHapus" class="flex-1 px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pegawai.js"></script>
</body>
</html>
