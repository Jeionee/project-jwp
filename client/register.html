<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Redirect jika sudah login -->
  <script>
    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.replace('/');
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Dashboard Kepegawaian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#0f172a' } } }
    }
  </script>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.45s ease both; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-6px); }
      40%, 80%  { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body class="bg-slate-50 font-sans antialiased min-h-screen flex items-center justify-center px-4 py-10">

  <!-- Background dekoratif -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-100 rounded-full opacity-50 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-100 rounded-full opacity-50 blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md fade-up">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-xl mb-4 shadow-lg">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Buat Akun Baru</h1>
        <p class="text-slate-500 text-sm mt-1">Daftar sebagai pegawai untuk mengakses sistem</p>
      </div>

      <!-- Alert -->
      <div id="alertError" class="hidden mb-5 flex items-start gap-3 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="alertMsg"></span>
      </div>
      <div id="alertSuccess" class="hidden mb-5 flex items-start gap-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm px-4 py-3 rounded-xl">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span id="successMsg"></span>
      </div>

      <!-- Form -->
      <form id="formRegister" class="space-y-4" novalidate>

        <!-- Nama Lengkap -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Nama Lengkap <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input type="text" id="inputName" autocomplete="name"
              placeholder="Contoh: Budi Santoso"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm
                     focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent
                     transition placeholder-slate-400" />
          </div>
        </div>

        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Username <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </span>
            <input type="text" id="inputUsername" autocomplete="username"
              placeholder="Contoh: budi123"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm
                     focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent
                     transition placeholder-slate-400" />
          </div>
          <p class="text-xs text-slate-400 mt-1">Gunakan huruf, angka, atau underscore. Tanpa spasi.</p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Password <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input type="password" id="inputPassword" autocomplete="new-password"
              placeholder="Minimal 6 karakter"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm
                     focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent
                     transition placeholder-slate-400" />
          </div>
        </div>

        <!-- Konfirmasi Password -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Konfirmasi Password <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
            </span>
            <input type="password" id="inputConfirm" autocomplete="new-password"
              placeholder="Ulangi password"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm
                     focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent
                     transition placeholder-slate-400" />
          </div>
        </div>

        <!-- Info role -->
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3 flex items-start gap-3">
          <svg class="w-4 h-4 text-indigo-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-xs text-indigo-700">
            Akun yang didaftarkan memiliki akses <strong>hanya lihat</strong> data pegawai.
            Untuk akses edit & hapus, hubungi Administrator.
          </p>
        </div>

        <!-- Tombol Daftar -->
        <button type="submit" id="btnDaftar"
          class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-semibold
                 hover:bg-indigo-700 active:scale-95 transition-all duration-150 shadow-sm
                 flex items-center justify-center gap-2 mt-2">
          <span id="btnText">Daftar Sekarang</span>
          <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
        </button>
      </form>

      <!-- Link ke Login -->
      <p class="mt-6 text-center text-sm text-slate-500">
        Sudah punya akun?
        <a href="/login.html" class="font-semibold text-slate-800 hover:text-indigo-600 transition-colors">
          Masuk di sini
        </a>
      </p>

    </div>

    <p class="text-center text-xs text-slate-400 mt-5">
      Dashboard Kepegawaian &copy; 2026
    </p>
  </div>

  <script type="module" src="/src/register.js"></script>
</body>
</html>
